min_version = "2026.10.11"

[tools]
bat = "0.26.1"
btop = "1.4.8"
chezmoi = "latest"
doggo = "1.4.2"
fd = "10.5.2"
fzf = "0.75.0"
github-cli = "2.106.0"
jj = "0.47.1"
lsd = "1.2.0"
node = "26.6.0"
ripgrep = "16.0.0"
starship = "1.27.0"
"github:nushell/nushell" = { version = "0.117.0", filter_bins = "nu" }
zellij = "0.46.1"
zoxide = "0.10.0"
lazygit = "0.66.3"
cloudflared = "2026.11.2"
"aqua:neovim" = "0.12.6"
go = "1.25.6"
"github:supabase/cli" = "3.4.0"
deno = "2.9.8"
"npm:wrangler" = "4.168.0"
"npm:@opencode/cli" = { version = "latest", auto_update = "24h", allow_builds = ["@opencode/cli"] }
"npm:@google/gemini-cli" = "0.71.1"
"npm:aicommits" = "5.0.1"
"npm:openclaw" = { version = "latest", allow_builds = ["openclaw"] }
# 0.9.32 has no SLSA provenance. These excludes are the exact versions only
# (https://mise.jdx.dev/dev-tools/backends/npm). Drop them when a later release
# publishes provenance. Do not exclude the package name alone.
"npm:@agentmemory/agentmemory" = { version = "0.9.32", trust_policy_excludes = ["@agentmemory/agentmemory@0.9.32"] }
"npm:@agentmemory/mcp" = { version = "0.9.32", trust_policy_excludes = ["@agentmemory/mcp@0.9.32", "@agentmemory/agentmemory@0.9.32"] }
tmux = "latest"
uv = "latest"
"github:ifd3f/caligula" = "0.5.0"
"npm:@juliusbrussee/caveman-code" = "0.65.2"
bun = "latest"

[settings]
experimental = true
auto_update = true
lockfile = true
# Install uses the committed lock and does not rewrite it. `latest` tools
# otherwise re-resolve during `mise install`, and chezmoi then prompts because
# the deployed lock changed. Refresh the lock on purpose with `mise lock`.
locked = true
pin = true
disable_backends = ["asdf", "vfox"] # Don't use these backends

[env]
OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS = '240000'

[tasks.llama-server.env]
HF_HUB_ENABLE_HF_TRANSFER = "1"
LLAMA_ARG_HOST = "127.0.0.1"
LLAMA_ARG_PORT = "8080"
