name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          path: "."
          pattern: "*.sh"

      - name: markdownlint
        uses: reviewdog/action-markdownlint@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check

      # mise lock --check needs >= 2026.11.12 (false failures for platforms
      # with no build were fixed in that release). The repo lock is
      # dot_config/mise/mise.lock; checking from the repo root or with -g
      # before chezmoi apply reports no tools and exits 0.
      - name: Check mise.lock matches pins
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | MISE_VERSION=v2026.11.14 sh
          mise="$HOME/.local/bin/mise"
          "$mise" --version
          "$mise" trust dot_config/mise/mise.toml
          "$mise" -C dot_config/mise lock --check

  template-checks:
    name: Template checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/chezmoi" --version

      - name: Render + syntax-check all templates
        run: tests/template-checks/check.sh

  sandbox:
    name: Sandbox (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora, arch]
    steps:
      - uses: actions/checkout@v7

      - name: Run sandbox install suite
        run: tests/sandbox/run.sh --distro ${{ matrix.distro }}

  sandbox-full:
    name: Sandbox full (ubuntu, mise install)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Run sandbox full lane
        run: tests/sandbox/run.sh --distro ubuntu --full

  macos:
    name: macOS (partial coverage)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Run macOS core install verification
        run: tests/sandbox/macos-run.sh
